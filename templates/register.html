{% extends 'base.html' %}
{% block title %}Cadastre-se — AutoBR{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto; padding: 2rem; background: var(--card); border-radius: 12px; border: 1px solid var(--border);">
    <h2 style="font-family: 'Syne', sans-serif; margin-bottom: 0.5rem;">Criar Conta</h2>
    <p style="color: var(--muted); margin-bottom: 1.5rem; font-size: 0.9rem;">Junte-se à maior montra de veículos de Pernambuco.</p>
    
    <form method="POST" action="{{ url_for('register') }}">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--muted);">Nome de Utilizador</label>
            <input type="text" name="username" required 
                   style="width:100%; padding: 0.8rem; background: var(--surface2); border: 1px solid var(--border); color: white; border-radius: 8px;">
        </div>
        
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--muted);">Senha</label>
            <input type="password" name="password" required 
                   style="width:100%; padding: 0.8rem; background: var(--surface2); border: 1px solid var(--border); color: white; border-radius: 8px;">
        </div>
        
        <button type="submit" class="btn-primary" style="width: 100%; padding: 0.8rem; font-weight: bold;">
            Finalizar Cadastro
        </button>
    </form>
    
    <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--muted); text-align: center;">
        Já tem uma conta? <a href="{{ url_for('login') }}" style="color: var(--accent); text-decoration: none;">Faça login</a>
    </p>
</div>
{% endblock %}
